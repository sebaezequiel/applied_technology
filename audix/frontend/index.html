<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b2a27">
  <title>Audix</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="pantalla" id="inicio">
    <section class="mascota" aria-label="Mascota y racha">
      <div class="mascota-circulo">
        <!-- Imagen del hurón; cambia según el estado de la racha -->
        <img id="mascota-img" alt="Mascota: hurón con bufanda" src="icons/icon-192.png">
      </div>
      <p class="racha-titulo" id="racha-titulo">Racha: 0 días</p>
      <p class="racha-detalle" id="racha-detalle">Escuchá hoy para empezar tu racha</p>
    </section>

    <section class="semana" id="semana" aria-label="Días escuchados esta semana"></section>

    <div class="acciones">
      <button type="button" class="boton-principal" id="btn-escuchar">
        <span aria-hidden="true">▶</span> Escuchar
      </button>
      <button type="button" class="boton-secundario" id="btn-importar">
        + Importar PDF / EPUB
      </button>
      <input type="file" id="input-archivo" accept=".epub,.pdf" hidden>
    </div>
  </main>

  <script src="app.js" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
