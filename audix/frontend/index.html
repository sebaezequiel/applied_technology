<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b2a27">
  <title>Audix</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Inicio: mascota, racha y acciones principales -->
  <main class="pantalla" id="inicio">
    <section class="mascota" aria-label="Mascota y racha">
      <div class="mascota-circulo" id="mascota"></div>
      <p class="racha-titulo" id="racha-titulo">Racha: 0 días</p>
      <p class="racha-detalle" id="racha-detalle">Escuchá hoy para empezar tu racha</p>
    </section>

    <section class="semana" id="semana" aria-label="Días escuchados esta semana"></section>

    <div class="acciones">
      <button type="button" class="boton-principal" id="btn-escuchar">
        <span aria-hidden="true">▶</span> Escuchar
      </button>
      <button type="button" class="boton-secundario" id="btn-importar">
        + Importar libro
      </button>
      <p class="aviso" id="aviso-importar" aria-live="polite"></p>
    </div>
  </main>

  <!-- Modal: flujo de importación -->
  <div class="modal-fondo" id="modal-importar" hidden aria-modal="true" role="dialog" aria-label="Importar libro">
    <div class="modal">

      <!-- Paso 1: elegir tipo de archivo -->
      <section class="modal-paso" id="paso-tipo-archivo">
        <h2 class="modal-titulo">¿Qué querés importar?</h2>
        <div class="modal-opciones">
          <button type="button" class="opcion-formato" id="opcion-epub">
            <span class="opcion-icono">📖</span>
            <span class="opcion-label">EPUB</span>
          </button>
          <button type="button" class="opcion-formato" id="opcion-pdf">
            <span class="opcion-icono">📄</span>
            <span class="opcion-label">PDF</span>
          </button>
        </div>
        <button type="button" class="boton-texto" id="modal-cerrar-1">Cancelar</button>
      </section>

      <!-- Paso 2a: EPUB — sube directamente -->
      <section class="modal-paso" id="paso-epub" hidden>
        <h2 class="modal-titulo">Importar EPUB</h2>
        <p class="modal-desc">Elegí el archivo EPUB de tu biblioteca.</p>
        <input type="file" id="input-epub" accept=".epub,application/epub+zip" hidden>
        <button type="button" class="boton-principal" id="btn-elegir-epub">Elegir archivo</button>
        <progress class="progreso-importar" id="progreso-importar" max="100" value="0" hidden></progress>
        <p class="aviso" id="aviso-epub" aria-live="polite"></p>
        <button type="button" class="boton-texto" id="modal-cerrar-epub">Cancelar</button>
      </section>

      <!-- Paso 2b: PDF — elige tipo de documento -->
      <section class="modal-paso" id="paso-pdf-tipo" hidden>
        <h2 class="modal-titulo">¿Qué tipo de PDF es?</h2>
        <div class="modal-opciones modal-opciones-col">
          <label class="opcion-radio">
            <input type="radio" name="tipo-pdf" value="novela" checked> Novela
          </label>
          <label class="opcion-radio">
            <input type="radio" name="tipo-pdf" value="cuento"> Cuento
          </label>
          <label class="opcion-radio">
            <input type="radio" name="tipo-pdf" value="poesia"> Poesía
          </label>
          <label class="opcion-radio">
            <input type="radio" name="tipo-pdf" value="apuntes"> Apuntes / texto informativo
          </label>
        </div>
        <input type="file" id="input-pdf" accept=".pdf,application/pdf" hidden>
        <button type="button" class="boton-principal" id="btn-elegir-pdf">Elegir archivo PDF</button>
        <p class="aviso" id="aviso-pdf-tipo" aria-live="polite"></p>
        <button type="button" class="boton-texto" id="modal-cerrar-pdf-tipo">Cancelar</button>
      </section>

      <!-- Paso 3: vista previa de capítulos -->
      <section class="modal-paso" id="paso-preview" hidden>
        <h2 class="modal-titulo">Vista previa</h2>
        <p class="modal-desc" id="preview-desc"></p>
        <ul class="lista-preview" id="lista-preview"></ul>
        <div class="modal-acciones">
          <button type="button" class="boton-secundario" id="btn-preview-volver">Cambiar tipo</button>
          <button type="button" class="boton-principal" id="btn-preview-confirmar">Importar</button>
        </div>
        <progress class="progreso-importar" id="progreso-pdf" max="100" value="0" hidden></progress>
        <p class="aviso" id="aviso-preview" aria-live="polite"></p>
        <button type="button" class="boton-texto" id="modal-cerrar-preview">Cancelar</button>
      </section>

    </div>
  </div>

  <!-- Biblioteca: libros disponibles -->
  <main class="pantalla" id="biblioteca" hidden>
    <header class="encabezado">
      <button type="button" class="volver" data-volver="inicio" aria-label="Volver">←</button>
      <h1>Biblioteca</h1>
    </header>
    <p class="aviso" id="aviso-biblioteca"></p>
    <div class="lista" id="lista-libros"></div>
  </main>

  <!-- Libro: capítulos -->
  <main class="pantalla" id="libro" hidden>
    <header class="encabezado">
      <button type="button" class="volver" data-volver="biblioteca" aria-label="Volver">←</button>
      <h1 id="titulo-libro"></h1>
    </header>
    <div class="cabecera-libro">
      <div id="portada-libro"></div>
      <div class="datos-libro">
        <p class="autor" id="autor-libro"></p>
        <button type="button" class="boton-secundario" id="btn-cambiar-portada">Cambiar portada</button>
        <button type="button" class="boton-secundario" id="btn-cambiar-titulo">Cambiar título</button>
        <button type="button" class="boton-peligro" id="btn-borrar-libro">Borrar libro</button>
      </div>
    </div>
    <p class="aviso" id="aviso-libro" aria-live="polite"></p>
    <input type="file" id="input-portada" accept="image/jpeg,image/png,image/webp" hidden>
    <div class="lista" id="lista-capitulos"></div>
  </main>

  <!-- Lector: reproducción en voz alta -->
  <main class="pantalla" id="lector" hidden>
    <header class="encabezado">
      <button type="button" class="volver" data-volver="libro" aria-label="Volver">←</button>
      <h1 id="titulo-lector"></h1>
    </header>

    <section class="reproductor">
      <div id="portada-lector" class="portada-lector"></div>
      <p class="capitulo-actual" id="capitulo-actual"></p>
      <p class="progreso-texto" id="progreso-lector"></p>
      <div class="barra"><div class="barra-relleno" id="barra-progreso"></div></div>

      <div class="controles">
        <button type="button" class="control" id="btn-anterior" aria-label="Capítulo anterior">⏮</button>
        <button type="button" class="control control-principal" id="btn-reproducir">▶ Reproducir</button>
        <button type="button" class="control" id="btn-siguiente" aria-label="Capítulo siguiente">⏭</button>
      </div>

      <label class="campo">
        Velocidad
        <select id="selector-velocidad">
          <option value="0.8">0.8×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
        </select>
      </label>

      <label class="campo">
        Voz
        <select id="selector-voz"></select>
      </label>
    </section>
  </main>

  <!-- Mini reproductor: aparece fuera del lector mientras suena un capítulo -->
  <div class="mini-reproductor" id="mini-reproductor" hidden>
    <button type="button" class="mini-info" id="mini-info">
      <span id="mini-portada"></span>
      <span class="mini-texto">
        <strong id="mini-titulo"></strong>
        <small id="mini-capitulo"></small>
      </span>
    </button>
    <button type="button" class="mini-play" id="mini-play" aria-label="Reproducir o pausar">▶</button>
  </div>

  <script src="config.js"></script>
  <script src="racha.js"></script>
  <script src="mascota.js"></script>
  <script src="lector.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
